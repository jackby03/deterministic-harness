name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # There are no dependencies, so there is no go.sum to cache against.
          cache: false

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: go test ./...

      # The repository verifies itself with its own profile. If this step fails,
      # the harness is not trustworthy for anyone else either.
      - name: Self-verification
        run: |
          go run ./cmd/harness-verify \
            -registry gates.yaml \
            -tier 2 \
            -backend host \
            -out .artifacts/verify-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: .artifacts/verify-report.json
